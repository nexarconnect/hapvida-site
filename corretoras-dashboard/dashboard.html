<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Monitor de Corretoras</title>
<style>
:root {
  --fundo: #0b1220; --card: #111c33; --borda: #1e2a45;
  --texto: #e2e8f0; --texto-suave: #7c8db5;
  --primaria: #3b82f6; --secundaria: #a78bfa;
  --verde: #34d399; --amarelo: #fbbf24; --vermelho: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
body { background:var(--fundo); color:var(--texto); min-height:100vh; }
.topo { background:var(--card); border-bottom:1px solid var(--borda); padding:20px 24px; }
.topo h1 { font-size:24px; font-weight:700; }
.topo .sub { color:var(--texto-suave); font-size:13px; margin-top:4px; }
.conteudo { padding:24px; max-width:1400px; margin:0 auto; }
.acoes { display:flex; gap:10px; margin:20px 0; flex-wrap:wrap; align-items:center; }
.btn { background:var(--primaria); color:#fff; border:none; padding:12px 24px; border-radius:8px;
  cursor:pointer; font-size:14px; font-weight:600; transition:.2s; }
.btn:hover { filter:brightness(1.15); }
.btn-sec { background:var(--card); border:1px solid var(--borda); color:var(--texto); }
.filtros { display:flex; gap:12px; margin:20px 0; flex-wrap:wrap; align-items:flex-end; }
.filtro { display:flex; flex-direction:column; gap:4px; }
.filtro label { font-size:11px; color:var(--texto-suave); text-transform:uppercase; font-weight:600; }
select { background:var(--card); color:var(--texto); border:1px solid var(--borda);
  border-radius:8px; padding:9px 12px; font-size:13px; min-width:160px; }
select:focus { outline:none; border-color:var(--primaria); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin:20px 0; }
.kpi { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:18px; text-align:center; }
.kpi .num { font-size:30px; font-weight:800; color:var(--primaria); }
.kpi .num.green { color:var(--verde); } .kpi .num.yellow { color:var(--amarelo); } .kpi .num.red { color:var(--vermelho); }
.kpi .label { font-size:12px; color:var(--texto-suave); margin-top:6px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
@media(max-width:900px){ .grid{grid-template-columns:1fr;} }
.card { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:18px; }
.card h3 { font-size:15px; margin-bottom:14px; }
.card canvas { width:100% !important; height:300px; }
.aviso { background:#3f2d0c; border:1px solid #7a5b12; color:#fcd34d; border-radius:10px;
  padding:12px 14px; font-size:13px; margin:16px 0; line-height:1.5; }
.tabela-wrap { overflow-x:auto; max-height:520px; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--borda); vertical-align:top; }
th { color:var(--texto-suave); font-weight:600; text-transform:uppercase; font-size:11px; position:sticky; top:0; background:var(--card); white-space:nowrap; }
td.col-resultados { white-space:normal; min-width:340px; line-height:1.7; }
td.col-corretora, td.col-dimensao { white-space:nowrap; }
tr:hover { background:var(--fundo); }
tr.propria td { background:#132a1f; }
tr.propria:hover td { background:#173526; }
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.b-green{background:#14532d;color:var(--verde);} .b-red{background:#7f1d1d;color:var(--vermelho);}
.b-blue{background:#1e3a8a;color:var(--primaria);} .b-gray{background:var(--borda);color:var(--texto);}
.b-yellow{background:#78350f;color:var(--amarelo);} .b-roxo{background:#4c1d95;color:var(--secundaria);}
.item-res { display:block; padding:2px 0; color:var(--texto); }
.item-res::before { content:"• "; color:var(--texto-suave); }
.empty { color:var(--texto-suave); text-align:center; padding:40px; font-size:14px; }
.carregando { color:var(--texto-suave); text-align:center; padding:40px; font-size:15px; }
.links a { color:var(--primaria); text-decoration:none; }
.links a:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="topo">
  <h1>📊 Painel Monitor de Corretoras de Saúde</h1>
  <div class="sub">Dados puxados automaticamente do backend + links de campanhas e bibliotecas de ads</div>
</div>

<div class="conteudo">
  <div class="acoes">
    <button class="btn" onclick="carregarDados()">🔄 Carregar Dados</button>
    <button class="btn btn-sec" onclick="exportarCSV()">⬇️ Exportar CSV</button>
  </div>

  <div class="filtros">
    <div class="filtro"><label>Corretora</label>
      <select id="filtroCorretora" onchange="aplicarFiltros()"><option value="">Todas</option></select></div>
    <div class="filtro"><label>Dimensão</label>
      <select id="filtroDimensao" onchange="aplicarFiltros()"><option value="">Todas</option></select></div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div id="avisoArea"></div>

  <div class="grid">
    <div class="card"><h3>📈 Dimensões com dados, por corretora</h3><canvas id="graficoCorretoras"></canvas></div>
    <div class="card"><h3>🥧 Situação das buscas</h3><canvas id="graficoPizza"></canvas></div>
    <div class="card" style="grid-column:1/-1;"><h3>🔗 Campanhas e Bibliotecas de Ads</h3>
      <div class="links" id="linksArea"><div class="empty">Clique em Carregar Dados</div></div></div>
    <div class="card" style="grid-column:1/-1;"><h3>📋 Tabela de Dados</h3>
      <div class="tabela-wrap" id="tabela"><div class="empty">Clique em Carregar Dados</div></div></div>
  </div>
</div>

<script>
let dadosMestre = [];

async function carregarDados() {
  const tabela = document.getElementById('tabela');
  // A corretora escolhida no filtro vira parâmetro da busca: consultar uma só
  // reduz muito o bloqueio por limite de requisições do DuckDuckGo.
  const escolhida = document.getElementById('filtroCorretora').value;
  const q = escolhida ? `?corretora=${encodeURIComponent(escolhida)}` : '';
  tabela.innerHTML = `<div class="carregando">Buscando ${escolhida || 'todas as corretoras'} no DuckDuckGo... isso leva um tempo.</div>`;
  try {
    const [resDados, resCamp, resBib] = await Promise.all([
      fetch('/api/dados' + q), fetch('/api/campanhas' + q), fetch('/api/bibliotecas' + q)
    ]);
    const dados = await resDados.json();
    const camp = await resCamp.json();
    const bib = await resBib.json();
    dadosMestre = dados.dados;
    popularFiltros(escolhida);
    aplicarFiltros();
    const alvo = escolhida || (bib.dados[0] && dadosMestre[0] ? dadosMestre[0].corretora : 'a primeira corretora');
    renderLinks(camp.dados, bib.dados, alvo, camp.consultas_bloqueadas || 0);
  } catch (e) {
    tabela.innerHTML = '<div class="empty">Erro ao conectar no backend. Rode: python server.py</div>';
  }
}

function popularFiltros(manterSelecao) {
  // Só popula a lista de corretoras uma vez (na carga inicial, com todas) —
  // se recarregasse toda vez com o resultado filtrado, escolher uma corretora
  // faria o próprio filtro desaparecer das opções.
  const selCorretora = document.getElementById('filtroCorretora');
  if (selCorretora.options.length <= 1) {
    const corretoras = [...new Set(dadosMestre.map(d => d.corretora))];
    selCorretora.innerHTML = '<option value="">Todas</option>' + corretoras.map(c => `<option>${esc(c)}</option>`).join('');
  }
  if (manterSelecao) selCorretora.value = manterSelecao;

  const dims = Object.keys(ROTULO_DIMENSAO);
  document.getElementById('filtroDimensao').innerHTML =
    '<option value="">Todas</option>' + dims.map(d => `<option value="${d}">${ROTULO_DIMENSAO[d]}</option>`).join('');
}

function dadosFiltrados() {
  const c = document.getElementById('filtroCorretora').value;
  const d = document.getElementById('filtroDimensao').value;
  return dadosMestre.filter(x => (!c || x.corretora === c) && (!d || x.dimensao === d));
}

function aplicarFiltros() {
  const dados = dadosFiltrados();
  renderKPIs(dados);
  renderAviso(dados);
  // Contar registros por corretora não diz nada: toda corretora tem sempre uma
  // linha por dimensão. O que interessa é em quantas dimensões ela tem dado.
  desenharBarras('graficoCorretoras', contarComDados(dados), '#3b82f6');
  desenharPizza('graficoPizza', agrupar(dados, 'status'));
  renderTabela(dados);
}

function agrupar(dados, chave) {
  const por = {};
  dados.forEach(d => { const n = d[chave] || 'outros'; por[n] = (por[n]||0)+1; });
  return por;
}

function contarComDados(dados) {
  const por = {};
  dados.forEach(d => {
    const n = d.corretora || 'outros';
    if (por[n] === undefined) por[n] = 0;
    if (d.status === 'ok') por[n] += 1;
  });
  return por;
}

function renderKPIs(dados) {
  const totalCorr = new Set(dados.map(d => d.corretora)).size;
  const ok = dados.filter(d => d.status === 'ok').length;
  const bloqueadas = dados.filter(d => d.status === 'bloqueado').length;
  // O percentual só faz sentido sobre as buscas que realmente rodaram; incluir
  // as bloqueadas no denominador faria o painel afirmar ausência de dado onde
  // a busca sequer chegou a acontecer.
  const validas = dados.length - bloqueadas;
  const pct = validas ? Math.round(ok / validas * 100) : 0;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="num">${totalCorr}</div><div class="label">Corretoras</div></div>
    <div class="kpi"><div class="num green">${ok}</div><div class="label">Buscas com resultado</div></div>
    <div class="kpi"><div class="num ${bloqueadas ? 'yellow' : 'green'}">${bloqueadas}</div><div class="label">Buscas bloqueadas</div></div>
    <div class="kpi"><div class="num ${pct >= 70 ? 'green' : pct >= 40 ? 'yellow' : 'red'}">${validas ? pct + '%' : '-'}</div><div class="label">Com dado (só buscas válidas)</div></div>`;
}

function renderAviso(dados) {
  const bloqueadas = dados.filter(d => d.status === 'bloqueado').length;
  const area = document.getElementById('avisoArea');
  if (!bloqueadas) { area.innerHTML = ''; return; }
  area.innerHTML = `<div class="aviso">⚠️ <strong>${bloqueadas} de ${dados.length}</strong> buscas foram
    bloqueadas pelo DuckDuckGo (limite de requisições). Elas aparecem como
    <span class="badge b-yellow">busca bloqueada</span> e <strong>não</strong> significam que a corretora
    não tem presença pública. Rode de novo mais tarde, ou filtre por uma corretora só, para consultar menos de uma vez.</div>`;
}

function renderLinks(campanhas, bibliotecas, alvo, bloqueadas) {
  let html = `<div style="margin-bottom:10px;color:var(--texto-suave);font-size:12px;">
    Mostrando <strong style="color:var(--texto);">${esc(alvo)}</strong>. Troque no filtro "Corretora" acima e clique em Carregar Dados.</div>`;
  html += '<div style="margin-bottom:10px;"><strong style="color:var(--texto-suave);font-size:12px;">Bibliotecas de Ads (clique para ver anúncios reais):</strong></div>';
  bibliotecas.forEach(b => {
    html += `<div style="margin-bottom:6px;">• <a href="${esc(b.link)}" target="_blank" rel="noopener noreferrer">${esc(b.plataforma)}</a></div>`;
  });
  html += '<div style="margin:14px 0 10px;"><strong style="color:var(--texto-suave);font-size:12px;">Campanhas encontradas:</strong></div>';
  if (bloqueadas) {
    html += `<div style="margin-bottom:8px;color:var(--amarelo);font-size:12px;">⚠️ ${bloqueadas} busca(s) de campanha foram bloqueadas pelo DuckDuckGo; a lista abaixo pode estar incompleta.</div>`;
  }
  if (!campanhas.length) html += '<div class="empty">Nenhuma campanha encontrada</div>';
  campanhas.forEach(c => {
    html += `<div style="margin-bottom:6px;">• <a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">${esc(c.campanha)}</a> <span style="color:var(--texto-suave);font-size:11px;">(${esc(c.corretora)})</span></div>`;
  });
  document.getElementById('linksArea').innerHTML = html;
}

function desenharBarras(canvasId, por, cor) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 400, h = canvas.clientHeight || 260;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const entradas = Object.entries(por).sort((a, b) => b[1] - a[1]);
  if (!entradas.length) { ctx.fillStyle='#64748b'; ctx.font='14px sans-serif'; ctx.fillText('Sem dados', 20, 30); return; }
  // Barras horizontais: com 17 corretoras os rótulos verticais se sobrepõem e
  // ficam ilegíveis, então o nome vai à esquerda, um por linha.
  const max = Math.max(...entradas.map(e => e[1]), 1);
  const rotuloW = 118, pad = 10, dir = 42;
  const alturaLinha = Math.min(26, (h - pad * 2) / entradas.length);
  const barH = Math.max(6, alturaLinha * 0.62);
  const larguraMax = w - rotuloW - dir;
  entradas.forEach(([n, v], i) => {
    const y = pad + i * alturaLinha;
    const bw = max ? (v / max) * larguraMax : 0;
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(n.length > 17 ? n.slice(0, 16) + '…' : n, rotuloW - 8, y + barH * 0.82);
    ctx.fillStyle = '#1e2a45';
    ctx.beginPath(); ctx.roundRect(rotuloW, y, larguraMax, barH, 3); ctx.fill();
    if (bw > 0) {
      const grad = ctx.createLinearGradient(rotuloW, 0, rotuloW + bw, 0);
      grad.addColorStop(0, cor); grad.addColorStop(1, cor + '99');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.roundRect(rotuloW, y, Math.max(bw, 3), barH, 3); ctx.fill();
    }
    ctx.fillStyle = v > 0 ? '#cbd5e1' : '#64748b';
    ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(String(v), rotuloW + larguraMax + 8, y + barH * 0.82);
  });
}

function desenharPizza(canvasId, por) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 400, h = canvas.clientHeight || 260;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const labels = Object.keys(por), valores = Object.values(por);
  if (!labels.length) { ctx.fillStyle='#64748b'; ctx.font='14px sans-serif'; ctx.fillText('Sem dados', 20, 30); return; }
  const total = valores.reduce((a,b) => a+b, 0);
  // Cor fixa por situação, para "bloqueado" nunca cair numa cor que pareça boa.
  const corPorStatus = { ok: '#34d399', vazio: '#7c8db5', bloqueado: '#fbbf24' };
  const paleta = ['#3b82f6','#a78bfa','#34d399','#fbbf24','#f87171','#60a5fa','#c084fc','#4ade80'];
  const rotuloAmigavel = { ok: 'com resultado', vazio: 'sem dados', bloqueado: 'busca bloqueada' };
  const cores = labels.map((n, i) => corPorStatus[n] || paleta[i % paleta.length]);
  const cx = w * 0.35, cy = h / 2, r = Math.min(w, h) * 0.32;
  let ang = -Math.PI / 2;
  valores.forEach((v, i) => {
    const fatia = (v / total) * 2 * Math.PI;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, ang, ang + fatia); ctx.closePath();
    ctx.fillStyle = cores[i]; ctx.fill();
    ctx.strokeStyle = '#0b1220'; ctx.lineWidth = 2; ctx.stroke();
    ang += fatia;
  });
  let ly = 20;
  labels.forEach((n, i) => {
    ctx.fillStyle = cores[i];
    ctx.fillRect(w * 0.62, ly, 12, 12);
    ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    const nome = rotuloAmigavel[n] || n;
    ctx.fillText(`${nome}: ${valores[i]} (${Math.round(valores[i]/total*100)}%)`, w * 0.62 + 18, ly + 10);
    ly += 22;
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

const ROTULO_DIMENSAO = {
  preco: 'Preço de leads', anuncios: 'Anúncios', imas: 'Ímãs de leads',
  reputacao: 'Reputação', novidades: 'Novidades',
};

function renderTabela(dados) {
  if (!dados.length) { document.getElementById('tabela').innerHTML = '<div class="empty">Nenhum dado</div>'; return; }
  let html = `<table><thead><tr>
    <th>Corretora</th><th>Dimensão</th><th>Situação</th><th>Resultados</th>
  </tr></thead><tbody>`;
  dados.forEach(d => {
    const selo = d.status === 'ok' ? '<span class="badge b-green">com resultado</span>'
      : d.status === 'bloqueado' ? '<span class="badge b-yellow">busca bloqueada</span>'
      : '<span class="badge b-gray">sem dados</span>';
    const corretora = d.propria
      ? `<span class="badge b-roxo">${esc(d.corretora)} (sua)</span>`
      : `<span class="badge b-blue">${esc(d.corretora)}</span>`;
    const itens = d.status === 'ok'
      ? d.resultados.split('||').map(x => `<span class="item-res">${esc(x)}</span>`).join('')
      : `<span style="color:var(--texto-suave);">${esc(d.resultados)}</span>`;
    html += `<tr class="${d.propria ? 'propria' : ''}">
      <td class="col-corretora">${corretora}</td>
      <td class="col-dimensao">${esc(ROTULO_DIMENSAO[d.dimensao] || d.dimensao)}</td>
      <td>${selo}</td>
      <td class="col-resultados">${itens}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('tabela').innerHTML = html;
}

function exportarCSV() {
  const dados = dadosFiltrados();
  if (!dados.length) { alert('Sem dados para exportar.'); return; }
  const cols = Object.keys(dados[0]);
  const linhas = [cols.join(';')].concat(dados.map(d => cols.map(c => d[c]||'').join(';')));
  const blob = new Blob([linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'monitor-corretoras.csv'; a.click();
}

window.onload = carregarDados;
</script>
</body>
</html>
